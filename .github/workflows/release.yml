name: Release

# A tag v<version> builds both archives and drafts their release, which a maintainer publishes by
# hand. Run by hand, the workflow builds the archives as artifacts and drafts nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No cache anywhere: what this workflow builds is what ships.
jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported runner, so that the binary needs glibc 2.35 at most.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            max-glibc: "2.35"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: The tag names the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "$TAG" in
            "v$version" | "v$version"-*) ;;
            *)
              echo "::error::the tag $TAG does not name the workspace version $version"
              exit 1
              ;;
          esac
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # rust-toolchain.toml pins the version; this installs it.
      - run: rustup show active-toolchain
      - name: Build the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MAX_GLIBC: ${{ matrix.max-glibc }}
        run: cargo xtask dist --target "$TARGET" ${MAX_GLIBC:+--max-glibc "$MAX_GLIBC"}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check the archives
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Draft the release, or refresh its draft
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          version="${TAG#v}"
          {
            echo "Observer $version, built from ${COMMIT:0:12}."
            echo
            for archive in ./*.zip; do
              echo "- \`${archive#./}\`: Windows 10 or Server 2016 and later, x64. Not signed: SmartScreen warns on the first run."
            done
            for archive in ./*.tar.gz; do
              echo "- \`${archive#./}\`: Linux x86_64 with glibc 2.35 or later (Ubuntu 22.04, Debian 12 and later)."
            done
            echo "- \`SHA256SUMS\`: check the archives with \`sha256sum -c SHA256SUMS\`, or \`Get-FileHash\` on Windows."
          } > ../notes.md
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::the release of $TAG is published already; it is left as it is"
              exit 1
            fi
            gh release upload "$TAG" --clobber ./*.zip ./*.tar.gz SHA256SUMS
          else
            prerelease=()
            case "$version" in
              *-*) prerelease=(--prerelease) ;;
            esac
            gh release create "$TAG" --draft --verify-tag --title "Observer $version" \
              --notes-file ../notes.md --generate-notes "${prerelease[@]}" \
              ./*.zip ./*.tar.gz SHA256SUMS
          fi
