name: Release

# A tag v<version> builds both archives and drafts their release, which a maintainer publishes by
# hand. Run by hand, the workflow builds the archives as artifacts and drafts nothing, even when
# the run is started on a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# No cache anywhere: what this workflow builds is what ships.
jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported runner, so that the binary needs glibc 2.35 at most.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            max-glibc: "2.35"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the workspace version
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          case "$TAG" in
            "v$version" | "v$version"-*) ;;
            *)
              echo "::error::the tag $TAG does not name the workspace version $version"
              exit 1
              ;;
          esac
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # rust-toolchain.toml pins the version; this installs it.
      - run: rustup show active-toolchain
      - name: Build the archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          MAX_GLIBC: ${{ matrix.max-glibc }}
        run: cargo xtask dist --target "$TARGET" ${MAX_GLIBC:+--max-glibc "$MAX_GLIBC"}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
            target/dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft the release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      # The public key the binaries carry, which the signature must match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: crates/observer-artifacts/src/releases/release-key.pub
          sparse-checkout-cone-mode: false
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check the archives
        working-directory: dist
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
      # Observer installs an update only once this signature checks with the key it was built with.
      - name: Sign the checksums
        working-directory: dist
        env:
          RELEASE_KEY: ${{ secrets.OBSERVER_RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then
            echo "::error::the OBSERVER_RELEASE_KEY secret is not set; run cargo xtask release-key, then gh secret set"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$RUNNER_TEMP/release-key.pub.pem"
          public=$(openssl pkey -pubin -in "$RUNNER_TEMP/release-key.pub.pem" -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')
          expected=$(tr -d '[:space:]' < ../source/crates/observer-artifacts/src/releases/release-key.pub)
          if [ "$public" != "$expected" ]; then
            echo "::error::OBSERVER_RELEASE_KEY is not the key whose public half the source carries"
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$key" -in SHA256SUMS -out SHA256SUMS.sig
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/release-key.pub.pem" -in SHA256SUMS -sigfile SHA256SUMS.sig
      - name: Draft the release, or refresh its draft
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          version="${TAG#v}"
          {
            echo "Observer $version, built from ${COMMIT:0:12}."
            echo
            for archive in ./*.zip; do
              echo "- \`${archive#./}\`: Windows 10 or Server 2016 and later, x64. Not signed: SmartScreen warns on the first run."
            done
            for archive in ./*.tar.gz; do
              echo "- \`${archive#./}\`: Linux x86_64 with glibc 2.35 or later (Ubuntu 22.04, Debian 12 and later)."
            done
            echo "- \`SHA256SUMS\`: check the archives with \`sha256sum -c SHA256SUMS\`, or \`Get-FileHash\` on Windows."
            echo "- \`SHA256SUMS.sig\`: the release key's Ed25519 signature of \`SHA256SUMS\`, which Observer checks before it installs an update."
          } > ../notes.md
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::the release of $TAG is published already; it is left as it is"
              exit 1
            fi
            gh release upload "$TAG" --clobber ./*.zip ./*.tar.gz SHA256SUMS SHA256SUMS.sig
          else
            prerelease=()
            case "$version" in
              *-*) prerelease=(--prerelease) ;;
            esac
            gh release create "$TAG" --draft --verify-tag --title "Observer $version" \
              --notes-file ../notes.md --generate-notes "${prerelease[@]}" \
              ./*.zip ./*.tar.gz SHA256SUMS SHA256SUMS.sig
          fi
