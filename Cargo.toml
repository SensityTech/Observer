[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
observer-app = { path = "crates/observer-app" }
observer-artifacts = { path = "crates/observer-artifacts" }
observer-domain = { path = "crates/observer-domain" }
observer-fxserver = { path = "crates/observer-fxserver" }
observer-platform = { path = "crates/observer-platform" }
observer-store = { path = "crates/observer-store" }
observer-web = { path = "crates/observer-web" }

anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu_no_default_features"] }
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
jiff = { version = "0.2.38", features = ["serde"] }
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz", "optimization"] }
memchr = "2.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
rustix = { version = "1.1.6", features = ["fs", "pipe", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.1"
tar = { version = "0.4.46", default-features = false }
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tempfile = "3.23.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rusqlite = "0.8.0"
tokio-tungstenite = "0.30.0"
tokio-util = "0.7.20"
toml = "1.1.8"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tray-icon = { version = "0.26.1", default-features = false }
ts-rs = { version = "12.0.1", features = ["jiff-impl"] }
vte = "0.15.0"
windows-sys = "0.61.2"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "parking_lot", "std", "wgsl"] }
winit = { version = "0.30.13", default-features = false }
winresource = { version = "0.1.34", default-features = false }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
