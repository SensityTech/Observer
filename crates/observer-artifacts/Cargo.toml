[package]
name = "observer-artifacts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A local archive server, crafted archives and a catalog that answers a fixed listing, for the tests
# of the crates above this one. Only their dev-dependencies turn it on.
test-support = ["lzma-rust2/encoder", "tokio/net"]

[dependencies]
getrandom.workspace = true
jiff.workspace = true
lzma-rust2.workspace = true
observer-platform.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true
zip.workspace = true

[dev-dependencies]
lzma-rust2 = { workspace = true, features = ["encoder"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt"] }

[lints]
workspace = true
