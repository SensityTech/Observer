[package]
name = "fake-fxserver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# What fake-archive writes the fake into: a zip on Windows, an xz-compressed tar on Linux.
lzma-rust2 = { workspace = true, features = ["encoder"] }
minidump-synth.workspace = true
serde_json.workspace = true
tar.workspace = true
test-assembler.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
jiff.workspace = true
observer-app.workspace = true
observer-artifacts = { workspace = true, features = ["test-support"] }
observer-domain.workspace = true
observer-fxserver.workspace = true
observer-platform.workspace = true
observer-store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
