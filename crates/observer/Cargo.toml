[package]
name = "observer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# With OBSERVER_TEST_CATALOG=<port>, builds are listed and downloaded from the fake FXServer's
# archive server on that port instead of Cfx.re. For the browser tests; `cargo xtask dist` never
# turns it on.
test-catalog = ["observer-artifacts/test-support"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
jiff.workspace = true
observer-app.workspace = true
observer-artifacts.workspace = true
observer-domain.workspace = true
observer-fxserver.workspace = true
observer-platform.workspace = true
observer-sftp.workspace = true
observer-store.workspace = true
observer-tools.workspace = true
observer-web.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
eframe.workspace = true
tray-icon.workspace = true
# The window draws through Direct3D 12 only, which falls back to WARP on hosts without a GPU.
wgpu.workspace = true
winit.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[dev-dependencies]
observer-gamefiles = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
