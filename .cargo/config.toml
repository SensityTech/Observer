# The C runtime goes into the executable, which then runs on a host without the Visual C++
# redistributable. Every Windows build takes it, so that the tests run what ships.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
xtask = "run --quiet --package xtask --"

[env]
TS_RS_EXPORT_DIR = { value = "web/src/api/generated", relative = true }
# serde writes 64-bit integers as JSON numbers; ids and versions stay far below 2^53.
TS_RS_LARGE_INT = "number"
